<!DOCTYPE html>
<html>
<head>
    {%metas%}
    <title>{%title%}</title>
    {%favicon%}
    {%css%}
    <style>
        /* =========================================================
           1. 頁面基礎設定
        ========================================================= */
        html, body, #react-entry-point {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================================================
           2. Dash 主容器與內容寬度
        ========================================================= */
        #page-content,
        #tab-content {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
        }

        .container,
        .container-fluid,
        .row,
        .col,
        [class*="col-"] {
            min-width: 0 !important;
        }

        /* =========================================================
           3. Plotly / Graph 寬度修正
        ========================================================= */
        .js-plotly-plot,
        .plot-container,
        .svg-container,
        .dash-graph {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
        }

        .dash-graph {
            overflow: hidden;
        }

        /* =========================================================
           4. Card / Card Body 防止內容撐破版面
        ========================================================= */
        .card,
        .card-body,
        .card-header,
        .card-footer {
            min-width: 0 !important;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .card-body pre,
        .card-body code {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* =========================================================
           5. 右側預覽卡片高度
        ========================================================= */
        .full-height-card {
            min-height: calc(100vh - 95px);
            height: calc(100vh - 95px);
        }

        .full-height-card .card-body {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .preview-wrap {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .preview-wrap .dash-graph {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
        }

        /* =========================================================
           6. 左側狀態 / log 小視窗建議樣式
           Python 有用到 pre 顯示 log 時可直接吃到
        ========================================================= */
        #run-log-viewer {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: auto;
            overflow-y: auto;
        }

        #json-info,
        #log-path-info,
        #output {
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* =========================================================
           7. Modal 內容避免太寬
        ========================================================= */
        .modal-dialog {
            max-width: min(1200px, 96vw);
        }

        .modal-body {
            overflow-x: hidden;
        }

        .modal .card,
        .modal .card-body,
        .modal .row,
        .modal .col,
        .modal [class*="col-"] {
            min-width: 0 !important;
        }

        /* =========================================================
           8. 小螢幕設定
        ========================================================= */
        @media (max-width: 991.98px) {
            #page-content {
                margin-left: 0 !important;
                width: 100% !important;
                padding-left: 8px !important;
                padding-right: 8px !important;
            }

            #sidebar {
                width: 240px !important;
                z-index: 1040 !important;
                box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
            }

            .full-height-card {
                min-height: auto;
                height: auto;
            }

            .preview-wrap .dash-graph {
                min-height: 420px;
            }

            .modal-dialog {
                max-width: 98vw;
                margin: 0.75rem auto;
            }
        }
    </style>
</head>
<body>
    {%app_entry%}
    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>
</body>
</html>
