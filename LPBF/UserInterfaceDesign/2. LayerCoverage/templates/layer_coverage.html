<!DOCTYPE html>
<html>
<head>
    {%metas%}
    <title>{%title%}</title>
    {%favicon%}
    {%css%}

    <style>
        html, body, #react-entry-point { width: 100%; min-height: 100%; margin: 0; padding: 0; overflow-x: hidden; } /* 基本頁面 */
        * { box-sizing: border-box; } /* 統一盒模型 */

        .js-plotly-plot, .plot-container, .svg-container, .dash-graph { width: 100% !important; max-width: 100% !important; min-width: 0 !important; } /* 圖表寬度 */
        #page-content, #tab-content { width: 100% !important; max-width: 100% !important; } /* 主內容寬度 */

        .rc-slider-mark-text { color: #ffffff !important; font-size: 12px !important; font-weight: 600 !important; } /* slider 刻度字 */
        .rc-slider-dot { border-color: #9aa4b2 !important; } /* slider 點 */
        .rc-slider-handle { border-color: #2ea8ff !important; box-shadow: 0 0 0 2px rgba(46,168,255,0.25) !important; } /* slider 控制點 */
        .rc-slider-track { background-color: #2ea8ff !important; } /* slider 已選軌道 */
        .rc-slider-rail { background-color: #4b5563 !important; } /* slider 底軌 */
        .rc-slider-tooltip-inner { color: #000000 !important; background: #ffffff !important; font-size: 15px !important; font-weight: 700 !important; } /* slider tooltip */
        .rc-slider-tooltip-arrow { border-top-color: #ffffff !important; } /* tooltip 箭頭 */

        @media (max-width: 991.98px) { /* 小螢幕 */
            #page-content { margin-left: 0 !important; width: 100% !important; padding-left: 8px !important; padding-right: 8px !important; } /* 內容滿版 */
            #sidebar { width: 240px !important; z-index: 1040 !important; box-shadow: 0 0 18px rgba(0,0,0,0.35); } /* sidebar 疊層 */
        }
    </style>
</head>

<body>
    {%app_entry%}

    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>
</body>
</html>
