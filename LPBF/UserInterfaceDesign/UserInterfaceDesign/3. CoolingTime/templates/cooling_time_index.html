<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    {%metas%}
    <title>{%title%}</title>
    {%favicon%}
    {%css%}
    <style>
        html, body, #react-entry-point {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #0f1117;
        }
        * { box-sizing: border-box; }
        .js-plotly-plot, .plot-container, .svg-container, .dash-graph {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
        }
        @media (max-width: 991.98px) {
            #page-content {
                margin-left: 0 !important;
                width: 100% !important;
                padding-left: 10px !important;
                padding-right: 10px !important;
            }
            #sidebar {
                width: 240px !important;
                z-index: 1040 !important;
                box-shadow: 0 0 18px rgba(0,0,0,0.35);
            }
        }
    </style>
</head>
<body>
    {%app_entry%}
    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>
</body>
</html>
